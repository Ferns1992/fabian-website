name: Deploy

# Manual only. This needs a CLOUDFLARE_API_TOKEN repo secret, which does not
# exist yet, and an automatic deploy without it would turn every push red.
# Once the secret is added, change `workflow_dispatch:` to:
#
#   push:
#     branches: [main]
#   workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fabian-website.fabianfernandes25.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a credential, so it is inlined.
          CLOUDFLARE_ACCOUNT_ID: c3f184ee95d95248dec5d8a9d65618e6

      - name: Verify the deployed site responds
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --retry-all-errors --max-time 30 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            https://fabian-website.fabianfernandes25.workers.dev/