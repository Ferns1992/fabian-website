    <script>
      // Resolve the theme before first paint.
      //
      // React cannot do this: the toggle component mounts after the bundle has
      // parsed and executed, so a visitor who chose light mode would get a
      // full-screen dark flash on every load. This has to be a blocking inline
      // script in <head>.
      (function () {
        try {
          var stored = localStorage.getItem('sysitadmin-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {
          // Private browsing can throw on localStorage; dark is a safe default.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
